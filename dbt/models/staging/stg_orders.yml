version: 2

models:
  - name: stg_orders
    description: >
      Orders from the configured raw batch, with blank values
      converted to NULL and timestamps cast without timezone conversion.

    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique

      - name: customer_id
        data_tests:
          - not_null

      - name: purchased_at
        data_tests:
          - not_null

      - name: estimated_delivery_at
        data_tests:
          - not_null

      - name: order_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - delivered
                  - shipped
                  - canceled
                  - unavailable
                  - invoiced
                  - processing
                  - created
                  - approved
